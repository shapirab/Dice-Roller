<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Dice Roller</title>
</head>
<body>
    <div class="container">
        <div class="container__header">
            <h1 class="heading">Roll The Dice And Win!!!</h1>
        </div>
        <div class="container__body">
            <div class="players-container">
                <div class="player">
                    <h3 class="player__heading">Player 1</h3>
                    <div class="dice--container">
                        <div class="dots--container dot-even">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-1"></div>
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-3"></div>
                            <div class="dot dot_num-4"></div>
                            <div class="dot dot_num-5"></div>
                        </div>
                        <div class="dots--container dot-even">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="dots--container dot-uneven active">
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-5"></div>
                            <div class="dot dot_num-3"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-3"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-5"></div>
                        </div>
                    </div>
                </div>
                <div class="player">
                    <h3 class="player__heading">Player 2</h3>
                    <div class="dice--container">
                        <div class="dots--container dot-even">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-1"></div>
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-3"></div>
                            <div class="dot dot_num-4"></div>
                            <div class="dot dot_num-5"></div>
                        </div>
                        <div class="dots--container dot-even active">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="dots--container dot-uneven ">
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-5"></div>
                            <div class="dot dot_num-3"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-2"></div>
                            <div class="dot dot_num-3"></div>
                        </div>
                        <div class="dots--container dot-uneven">
                            <div class="dot dot_num-5"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="action">
                <button class="btn btn--primary">Roll The Dice</button>
                <h3 class="action-results"><span>Player 1</span> Wins!</h3>
            </div>
        </div>
    </div>
    <script type="module" src="../scripts/app.js"></script>
</body>
</html>
